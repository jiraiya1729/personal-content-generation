<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center py-6">
  <div class="max-w-4xl w-full bg-white shadow-md rounded p-6">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-8">Quiz</h1>
    
    <div id="quiz-content">
      <!-- Questions will be dynamically populated here -->
    </div>

    <div class="text-center mt-6">
      <button
        onclick="submitQuiz()"
        class="px-6 py-3 text-white bg-blue-600 rounded hover:bg-blue-700"
      >
        Submit Quiz
      </button>
    </div>

    <div id="quiz-result" class="hidden mt-6 text-center">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Your Score: <span id="score"></span></h2>
      <button
        onclick="retryQuiz()"
        class="mt-4 px-6 py-3 text-white bg-blue-600 rounded hover:bg-blue-700"
      >
        Retry Quiz
      </button>
    </div>
  </div>

  <script>
    // Questions passed from Flask
    const questions = {{ questions_data | tojson }};
    const quizContent = document.getElementById('quiz-content');
    const quizResult = document.getElementById('quiz-result');
    const scoreElement = document.getElementById('score');
    let selectedAnswers = {};

    // Populate questions
    function populateQuestions() {
      let index = 1;
      for (const [key, value] of Object.entries(questions)) {
        const questionDiv = document.createElement('div');
        questionDiv.classList.add('mb-8');
        questionDiv.innerHTML = `
          <h3 class="text-lg font-semibold text-gray-800 mb-4">${index}. ${value.question}</h3>
          <ul class="space-y-3">
            ${value.options.map((option, idx) => {
              const optionLetter = String.fromCharCode(65 + idx);
              return `
                <li>
                  <button
                    class="block w-full px-4 py-2 text-left rounded bg-gray-200 text-gray-700 hover:bg-blue-200 focus:ring-2 focus:ring-blue-500"
                    onclick="selectAnswer('${key}', '${optionLetter}')"
                  >
                    ${optionLetter}. ${option}
                  </button>
                </li>`;
            }).join('')}
          </ul>
        `;
        quizContent.appendChild(questionDiv);
        index++;
      }
    }

    // Store selected answer
    function selectAnswer(questionId, option) {
      selectedAnswers[questionId] = option;
      console.log("Selected answers:", selectedAnswers);
    }

    // Submit quiz and calculate score
    function submitQuiz() {
      let score = 0;
      let totalQuestions = Object.keys(questions).length;

      for (const [key, value] of Object.entries(questions)) {
        if (selectedAnswers[key] === value.correct_answer) {
          score++;
        }
      }

      // Display result
      scoreElement.textContent = ${score} / ${totalQuestions};
      quizContent.classList.add('hidden');
      quizResult.classList.remove('hidden');
    }

    // Retry quiz
    function retryQuiz() {
      selectedAnswers = {};
      quizContent.innerHTML = '';
      populateQuestions();
      quizContent.classList.remove('hidden');
      quizResult.classList.add('hidden');
    }

    // Populate questions on page load
    populateQuestions();
  </script>
</body>
</html>
